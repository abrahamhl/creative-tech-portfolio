name: Recruiter portfolio paths
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-static-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check recruiter paths
        shell: bash
        run: |
          node scripts/build.mjs
          test -s dist/index.html
          test -s dist/cv/index.html
          test -s dist/industry-ai/index.html
          test -s dist/industry-ai/cv/index.html
          test -s dist/cv/Abraham-Haddioui-Creative-Technologist.pdf
          grep -q 'AI + Industrial technology' dist/index.html
          grep -q 'SENDA RoadSafe' dist/industry-ai/index.html
          grep -q 'ES/EN' dist/industry-ai/cv/index.html
          grep -q 'Not field-validated' dist/industry-ai/cv/index.html
